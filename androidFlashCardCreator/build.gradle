
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:1.0.0'
    }
}

apply plugin: 'com.android.application'

android {

    repositories {
        flatDir {
            dirs 'libs'
        }
    }

    compileSdkVersion 21
    buildToolsVersion '21.0.0'

    def versionPropsFile = file('version.properties')

    if (versionPropsFile.canRead()) {
        def Properties versionProps = new Properties()

        versionProps.load(new FileInputStream(versionPropsFile))

        def code = versionProps['VERSION_CODE'].toInteger() + 1

        versionProps['VERSION_CODE']=code.toString()
        versionProps.store(versionPropsFile.newWriter(), null)

        defaultConfig {
            applicationId "com.internectics.android_flashcardcreator"
            minSdkVersion 15
            targetSdkVersion 20
            versionCode code
            versionName '1.0'
        }
    }
    else {
        throw new GradleException("Could not read version.properties!")
    }



    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}


dependencies {
    compile 'com.android.support:support-v4:20.0.0'
    compile files('libs/aws-android-sdk-1.6.0-debug.jar')
    compile files('libs/dropbox-android-sdk-1.5.4.jar')
    compile files('libs/httpmime-4.0.3.jar')
    compile files('libs/json_simple-1.1.jar')
    compile files('libs/libGoogleAnalyticsV2.jar')
    compile files('libs/simple-social-sharing-1.0.1.jar')
    compile files('libs/zip4j_1.3.2.jar')
    compile 'asia.ivity.android:drag-sort-listview:1.0@aar'
    compile project(':Viewflow')
    compile project(':NewQuickAction3D')
    compile(name: 'android-crop-0.9.10', ext: 'aar')
    compile(name: 'android_target_tooltip_ccaa_22112014', ext: 'aar')
    compile 'com.nineoldandroids:library:+'
    compile 'com.jakewharton.timber:timber:2.5.1'
    compile 'com.parse.bolts:bolts-android:1.+'
    compile files('libs/ParseCrashReporting-1.8.3.jar')
    compile files('libs/Parse-1.8.3.jar')
    compile 'com.makeramen:roundedimageview:2.0.1'
    compile('cn.trinea.android.view.autoscrollviewpager:android-auto-scroll-view-pager:1.1.2') {
        exclude module: 'support-v4'
    }
    compile 'cn.pedant.sweetalert:library:1.3'
    compile project(':discreteSeekBar')
}

